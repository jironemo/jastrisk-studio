<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jastrisk Studio</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(120deg, #0f172a, #1d4ed8);
        color: #f8fafc;
      }

      main {
        width: min(680px, 92vw);
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.75);
        box-shadow: 0 1rem 2rem rgba(2, 6, 23, 0.25);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        line-height: 1.6;
      }

      .tagline {
        font-size: 1.125rem;
        font-weight: 600;
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jastrisk Studio</h1>
      <p class="tagline">Building thoughtful digital experiences.</p>
      <p>
        Welcome to Jastrisk Studio. This is a temporary landing page while we prepare our
        full website.
      </p>
      <p>For now, please check back soon for updates on our services, projects, and contact details.</p>
    </main>
  </body>
</html>
